<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
button,input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;height:34px}
button{cursor:pointer}button:hover{background:var(--soft)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
/* 셸 */
#shell{display:grid;grid-template-columns:clamp(340px,28vw,400px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;font-weight:600;margin:0 8px 0 0;white-space:nowrap}
#top #q{flex:1;max-width:380px;min-width:100px}
#tabs{display:none}
#side{overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);min-height:0}
#mapcol{position:relative;min-width:0;min-height:0}
#mw,#map{position:absolute;inset:0}
#map{background:var(--soft)}
.leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(.9)}
.leaflet-container{font:inherit}
#sbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#sbar b{font-weight:600}
#sbar select{height:32px;padding:2px 8px}
details.g{border-bottom:1px solid var(--line)}
details.g>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:12px 16px;font-weight:600}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::after{content:'＋';font-weight:400;color:var(--mute)}
details.g[open]>summary::after{content:'－'}
.gb{padding:0 16px 14px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
.lb{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub)}
.lb b{color:var(--ink);font-weight:600;font-size:13px}
.cl{font-size:12px;font-weight:600;color:var(--sub);margin:8px 0 4px}
.ch{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;margin:0 4px 6px 0}
.ch:has(input:checked){border-color:var(--acc);background:var(--acc-bg);color:var(--acc-ink)}
.ch input{margin:0}
#lstw{padding:12px 16px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cd.fv{border-color:var(--fav)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd .t{display:flex;align-items:center;gap:8px;min-width:0}
.hd b{font-weight:600;overflow-wrap:anywhere}
.nb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:600}
.sm{height:30px;font-size:13px;padding:2px 10px;white-space:nowrap}
.st{font-size:16px;line-height:1;padding:2px 8px;color:var(--mute)}
.st.on{color:var(--fav);border-color:var(--fav)}
.sub{font-size:12px;color:var(--sub);margin:4px 0 8px;overflow-wrap:anywhere}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.cg>div{background:var(--soft);border-radius:8px;padding:6px 8px}
.cg small{display:block;font-size:11px;color:var(--mute)}
.cg b{font-weight:600}
.bd{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--sub);margin:2px 4px 2px 0}
.bd.ok{background:var(--acc-bg);color:var(--acc-ink)}
.lk{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;margin-top:4px}
.note{font-size:11px;color:var(--mute);padding:12px 16px 24px;line-height:1.6}
.tt{width:100%;font-size:12px;border-collapse:collapse}
.tt th,.tt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-weight:400}
.tt th{color:var(--mute)}
/* 지도 */
#mtool{position:absolute;top:10px;left:54px;right:10px;z-index:1000;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#mtool::-webkit-scrollbar{display:none}
#mtool button{flex:none;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#lg{position:absolute;left:10px;bottom:24px;z-index:1000;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--sub);line-height:1.7}
#lg summary{cursor:pointer;padding:5px 10px;font-weight:600;list-style:none}
#lg summary::-webkit-details-marker{display:none}
#lg div{padding:0 10px 7px}
.rm{position:relative;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--card);border:1.5px solid var(--mute);color:var(--mute)}
.rm.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rm.fv::after{content:'★';position:absolute;top:-11px;right:-8px;font-size:14px;color:var(--fav);text-shadow:0 0 2px #fff,0 0 2px #fff}
.pin{font-size:16px;line-height:20px;text-align:center;color:#44403c;text-shadow:0 0 3px #fff,0 0 3px #fff}
.jk{font-size:28px;line-height:28px;text-align:center;color:var(--red);text-shadow:0 0 3px #fff,0 0 3px #fff}
.zt{font-size:12px;font-weight:600;white-space:nowrap;text-align:center;color:#57534e;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
.leaflet-tooltip.bt{font-size:12px;font-weight:600;padding:1px 6px}
.leaflet-tooltip.dt{font-size:12px;padding:1px 5px}
.zlow .bt{display:none}
.leaflet-popup-content{margin:12px 14px;width:min(300px,68vw)!important;font-size:13px;line-height:1.55}
.leaflet-popup-content h4{margin:10px 0 3px;font-size:12px;color:var(--sub)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-div-icon{background:none;border:0}
@media (max-width:860px){
#shell{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
#top{flex-wrap:wrap;padding:8px 12px}
#top h1{flex:1 0 100%;margin:0;font-size:15px}
#top #q{flex:1 0 100%;max-width:none;order:3}
#tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;height:auto;padding:10px 0;font-weight:600;color:var(--sub);background:none;border-bottom:2px solid transparent}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
body[data-v=map] #side{display:none}
body[data-v=list] #mapcol{display:none}
#side{border-right:0}
#mtool{left:50px}

</style>

$('list').innerHTML=a.map(r=>{const l=lo(r,f);return '<div class="cd'+(FV.has(r.id)?' fv':'')+'"><div class="hd"><div class="t"><span class="nb">'+r.i+'</span><b>'+r.nm+'</b></div><div style="display:flex;gap:4px;flex:none"><button class="sm" data-go="'+r.id+'">지도</button>'+star(r.id)+'</div></div><div class="sub">'+r.z+' · '+r.pt+'</div><div class="cg"><div><small>최저 월세</small><b>'+fm(l)+'</b></div><div><small>버스</small><b>'+r.b[0]+'</b></div><div><small>JIKS</small><b>'+fd1(r.jd)+'</b></div></div><div class="sub" style="margin:0 0 4px">MRT '+fd(r.mrt[0].d)+' · 빠델 '+fd(r.nb.pd[0].d)+' · 발레 '+fd(r.nb.bl[0].d)+' · 영어 '+fd(r.nb.en[0].d)+'</div><span class="bd">'+r.b[1]+'</span><span class="bd">'+(GRL[r.gr]||'뷰 미확인')+'</span>'+links(r)+'</div>'}).join('')}
function ttb(){const q=$('tq').value.trim().toLowerCase();
const rows=R.map(r=>[r.b[0],r.nm,r.b[1],r.z,r.i]).concat(X.map(x=>[x[1],x[0],x[2],x[3],0]));
rows.sort((a,b)=>tm(a[0])-tm(b[0])||a[1].localeCompare(b[1]));
const f=rows.filter(x=>!q||(x[1]+x[3]).toLowerCase().includes(q));
$('tt').innerHTML='<table class="tt"><thead><tr><th>시각</th><th>정류장</th><th>승차 지점</th><th>지도</th></tr></thead><tbody>'+f.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'<div style="color:var(--mute)">'+x[3]+'</div></td><td>'+x[2]+'</td><td>'+(x[4]?'<button class="sm" data-go="'+R[x[4]-1].id+'">'+x[4]+'번</button>':'')+'</td></tr>').join('')+'</tbody></table>'}
function all(){labels();const f=F();pass={};R.forEach(r=>{pass[r.id]=ok(r,f)});render();lst()}
const PRE={kem:[-6.2605,106.8095,15],cil:[-6.2840,106.7920,15],pi:[-6.2720,106.7830,15],jiks:[JK.lat,JK.lng,14],gan:[-6.2395,106.7860,15]};
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const k=b.dataset.pre;if(k==='all')fitAll();else map.setView([PRE[k][0],PRE[k][1]],PRE[k][2])});
$('app').addEventListener('input',e=>{const t=e.target;if(t.id==='tq'){ttb();return}if(t.closest('[data-l]')){render();return}if(t.id==='sort'){lst();return}all()});
function toggleFav(id){FV.has(id)?FV.delete(id):FV.add(id);fsv();const open=rm[id]&&rm[id].isPopupOpen();all();if(open&&rm[id])rm[id].openPopup()}
document.addEventListener('click',e=>{const s=e.target.closest('[data-fv]');if(s){toggleFav(s.dataset.fv);return}const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
const setv=(id,v)=>{$(id).value=v};
$('preset').onclick=()=>{setv('budget',15);setv('mrt',1.5);setv('pd',3);setv('bl',3);setv('en',2);setv('bus',0);document.querySelectorAll('[data-t],[data-f]').forEach(c=>{c.checked=['gym','pool','green'].includes(c.dataset.f)});$('unk').checked=false;$('q').value='';all()};
$('reset').onclick=()=>{setv('budget',60);setv('mrt',5);setv('pd',5);setv('bl',5);setv('en',5);setv('bus',0);document.querySelectorAll('[data-t],[data-f]').forEach(c=>{c.checked=false});$('unk').checked=true;$('fo').checked=false;$('q').value='';all()};
function setView(v){document.body.dataset.v=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(map)setTimeout(()=>map.invalidateSize(),60)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
addEventListener('resize',()=>map&&map.invalidateSize());
initMap();fitAll();all();ttb();
</script>
